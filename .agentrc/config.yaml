# Project agentrc config — conduit
agentrc_version: 2.2.0

agents:
  conduit-backend:
    name: Conduit Backend Engineer
    description: Go service development for the Conduit chat interface and conversation management
    roles: [backend, go]
    skills: [go-build, go-lint, go-test]
    context: agents/backend.md

  conduit-frontend:
    name: Conduit Frontend Developer
    description: React/TypeScript UI development for the Conduit chat interface
    roles: [frontend, react]
    skills: [frontend-design]
    plugins: [vercel]
    context: agents/frontend.md

  conduit-plugin-dev:
    name: Conduit Plugin Developer
    description: Develop, audit, and maintain Conduit plugins and the plugin scaffold
    roles: [backend, go]
    skills: [go-build, go-lint, go-test, doc-note, doc-search]
    context: agents/plugin-dev.md

  conduit-reviewer:
    name: Conduit Code Reviewer
    description: Code review for Conduit PRs
    roles: [code-review, go]
    skills: [go-lint, go-test]
