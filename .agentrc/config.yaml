# Project agentrc config — nanite
agentrc_version: 2.2.0

agents:
  nanite-backend:
    name: Nanite Backend Engineer
    description: Go service development for the Nanite chat harness
    roles: [backend, go]
    skills: [go-build, go-lint, go-test]
    context: agents/backend.md

  nanite-frontend:
    name: Nanite Frontend Developer
    description: React/TypeScript UI development for the Nanite chat interface
    roles: [frontend, react]
    skills: [frontend-design, shadcn-ui]
    plugins: [vercel]
    context: agents/frontend.md

  nanite-plugin-dev:
    name: Nanite Plugin Developer
    description: Develop, audit, and maintain Nanite plugins and the plugin scaffold
    roles: [backend, go]
    skills: [go-build, go-lint, go-test, doc-note, doc-search, shadcn-ui]
    plugins: [vercel]
    context: agents/plugin-dev.md

  nanite-reviewer:
    name: Nanite Code Reviewer
    description: Code review for Nanite PRs
    roles: [code-review, go]
    skills: [go-lint, go-test]
