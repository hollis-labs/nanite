  conduit-frontend:
    name: Conduit Frontend Developer
    description: React/TypeScript UI development for the Conduit chat interface
    roles: [frontend, react]
    skills: []
    context: agents/frontend.md

  conduit-reviewer:
    name: Conduit Code Reviewer
    description: Code review for Conduit PRs
    roles: [code-review, go]
    skills: [go-lint, go-test]
