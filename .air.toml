root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/conduit"
  cmd = "go build -o ./tmp/conduit ./cmd/conduit"
  delay = 1000
  exclude_dir = ["tmp", "ui", "node_modules", ".git", ".agentrc"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "sql"]
  kill_delay = "0s"
  send_interrupt = false
  stop_on_error = true

[build.args]
  bin = ["serve", "--dev", "--port", "8090"]

[log]
  time = false

[misc]
  clean_on_exit = true
