# GATE CONFIG — EDITING THIS FILE MOVES THE QUALITY RATCHET.
#
# This is the lint config of the nightly full-repo quality gate.
# `.github/workflows/full-repo-quality.yml` passes it to both
# `golangci-lint linters` and `golangci-lint run`, and that output feeds
# `scripts/quality-ratchet.py lint`. Changing the enabled-linter list or the
# per-linter settings below changes what the gate counts and therefore what the
# baseline in `.github/quality/full-repo-baseline.json` means.
#
# It began life audit-only, and said so here until 2026-08-24; it stopped being
# audit-only when the gate adopted it. Anyone who trusted the old header would
# have edited this file believing it was inconsequential. (verified-at 2a4cdf0f)
#
# Base = project .golangci.yml, plus complexity/duplication reporting linters.
# NOT used by lefthook's pre-commit `go-lint` or by `make lint` — both of those
# use the repo-root .golangci.yml.
#
# It lived under `docs/audits/` until that tree was archived out of the repo,
# which broke the gate silently: the workflow kept passing `--config` a path
# that no longer resolved. It is CI configuration, not documentation, and it
# now sits beside the baseline whose meaning it defines.

version: "2"

run:
  # Tracks go.mod:3 (`go 1.26.7`). Was pinned to "1.25" until 2026-08-24.
  # Measured before changing it: this key is inert for the linter set enabled
  # below. golangci-lint v2.11.4 reported the same 387 issues on
  # ./internal/store/... at 1.25, 1.26, 1.26.7, with the key absent, and even at
  # 1.16, with zero per-linter movement — no language-version-gated linter
  # (copyloopvar, intrange, usestdlibvars, gocritic, modernize) is enabled here.
  # So this was a stale-documentation defect, not a behavioural one; it is
  # corrected so it stops reading as a real 1.25 constraint on the gate.
  go: "1.26"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - revive
    - misspell
    - unconvert
    - unparam
    - exhaustive
    - errorlint
    - nilerr
    - forbidigo
    # --- audit-only additions (guide section 15) ---
    - cyclop
    - gocyclo
    - gocognit
    - maintidx
    - nestif
    - dupl
    - funlen

  settings:
    errcheck:
      exclude-functions:
        - fmt.Print
        - fmt.Println
        - fmt.Printf
        - fmt.Fprint
        - fmt.Fprintln
        - fmt.Fprintf

    exhaustive:
      default-signifies-exhaustive: true

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^os\.WriteFile$'
          msg: "use internal/fsutil.AtomicWriteFile for crash-safe writes (Phase 1 Wave 1)"
        - pattern: '^filepath\.Join$'
          msg: "use internal/pathsafe.ResolveUnder to prevent path traversal (Phase 1 Wave 1)"

    gosec:
      excludes:
        - G104

    govet:
      enable-all: true
      disable:
        - fieldalignment

    misspell:
      locale: US

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
          disabled: true
        - name: var-declaration
        - name: var-naming

    staticcheck:
      checks:
        - "all"
        - "-ST1000"

    unparam:
      check-exported: false

    # --- audit-only linter settings (guide section 15) ---
    cyclop:
      max-complexity: 15
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 5
    dupl:
      threshold: 100
    funlen:
      lines: 100
      statements: -1

  exclusions:
    generated: lax
    rules:
      - text: 'AtomicWriteFile'
        linters: [forbidigo]
        path-except: '(internal/agent/|internal/service/install/|internal/plugin/builtin/adapter-)'
      - text: 'ResolveUnder'
        linters: [forbidigo]
        path-except: '(internal/sandbox/|internal/mcp/|internal/service/install/)'
      - path: '^internal/(safego|pathsafe|lifecycle|fsutil)/'
        linters: [forbidigo]
      - path: _test\.go
        linters:
          - errcheck
          - unparam
          - dupl
          - funlen
      - path: _gen\.go
        linters:
          - all
      - path: \.pb\.go
        linters:
          - all
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
