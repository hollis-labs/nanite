name: nanite check
# Local CLI checks. The build step compiles packages without publishing an artifact.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: nanite-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      # go.mod is the single Go pin: the `go` line is the floor; an optional `toolchain` line, if
      # present, wins (setup-go v6+ only).
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      - name: pins match the Substrate BOM
        env:
          GOWORK: "off"
        run: go run github.com/hollis-labs/substrate/cmd/substrate pins check --app .
      - name: generated wiring is current
        run: |
          go run github.com/hollis-labs/substrate/cmd/substrate generate -f cmd/nanite/substrate.yaml
          git diff --exit-code -- cmd/nanite/substrate_wiring.go
      - run: go build ./...
      - run: go test -race -count=1 ./...
      - run: go run ./examples/embed-host --offline
      - name: public working-tree hygiene
        run: go run github.com/hollis-labs/substrate/cmd/substrate scan-public --tree
