name: Full-repo quality gate

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-repo-quality-gate
  cancel-in-progress: false

jobs:
  quality:
    strategy:
      matrix:
        include:
          # One source feeds both runs-on and the runtime baseline check.
          - runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/nanite
    steps:
      - name: Check out Nanite
        uses: actions/checkout@v4
        with:
          path: apps/nanite

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/nanite/go.mod
          cache: true
          cache-dependency-path: apps/nanite/go.sum

      - name: Verify runner matches committed baseline
        run: >-
          python3 scripts/quality-ratchet.py platform
          --runner "${{ matrix.runner }}"

      - name: Discover tracked Go packages
        shell: bash
        run: |
          set -euo pipefail
          go_list_file="$RUNNER_TEMP/go-list.txt"
          package_file="$RUNNER_TEMP/tracked-go-packages.txt"
          go list -f '{{.ImportPath}}{{"\t"}}{{.Dir}}' ./... > "$go_list_file"
          : > "$package_file"
          while IFS=$'\t' read -r _ directory; do
            relative=${directory#"$PWD"/}
            if git ls-files --error-unmatch -- "$relative/*.go" >/dev/null 2>&1; then
              echo "./$relative" >> "$package_file"
            fi
          done < "$go_list_file"
          cat "$package_file"

      # Every scanning step below is handed tracked-go-packages.txt, but only
      # lint and gosec have a comparator behind them. If this list silently
      # shrinks, govulncheck, deadcode and the race suite scan less and still
      # report success. `test -s` only proved the file held one byte.
      #
      # This is a FLOOR, not an equality. Packages leaving the scan set is the
      # hazard; packages being added is ordinary work. The equality this
      # replaced failed on every legitimate addition, and did so on eight
      # consecutive scheduled runs -- each dying here in well under two minutes
      # against a healthy run's fifteen, so the gate performed none of the
      # checks below while still being counted on as protection.
      #
      # Raise the floor to tighten loss detection, never merely because the
      # count went up.
      #
      # The floor is keyed on the TRACKED list the step above writes, which is
      # the same list every scanner below is handed. `go list ./...` answers a
      # different question and must not be substituted: in a checkout that has
      # run `npm install` it additionally returns
      # ui/node_modules/flatted/golang/pkg/flatted, a Go package vendored inside
      # npm that the git-tracked filter above removes.
      - name: Assert the discovered package list still covers the repository
        shell: bash
        run: |
          python3 scripts/quality-ratchet.py packages \
            --package-list "$RUNNER_TEMP/tracked-go-packages.txt" \
            --min 115

      - name: Install pinned quality tools
        shell: bash
        run: |
          tool_bin="$RUNNER_TEMP/quality-tools"
          mkdir -p "$tool_bin"
          echo "$tool_bin" >> "$GITHUB_PATH"
          GOBIN="$tool_bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          GOBIN="$tool_bin" go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          GOBIN="$tool_bin" go install golang.org/x/vuln/cmd/govulncheck@v1.2.0
          GOBIN="$tool_bin" go install golang.org/x/tools/cmd/deadcode@v0.45.0

      - name: Run uncapped audit-config lint ratchet (Stages 1 and 2)
        shell: bash
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < "$RUNNER_TEMP/tracked-go-packages.txt"
          golangci-lint linters \
            --config .github/quality/audit-golangci.yml \
            --json > "$RUNNER_TEMP/audit-linters.json"
          golangci-lint run \
            --config .github/quality/audit-golangci.yml \
            --issues-exit-code=0 \
            --max-issues-per-linter=0 \
            --max-same-issues=0 \
            --output.text.path="$RUNNER_TEMP/audit-lint.txt" \
            --output.text.colors=false \
            --output.json.path="$RUNNER_TEMP/audit-lint.json" \
            "${packages[@]}"
          python3 scripts/quality-ratchet.py lint \
            --report "$RUNNER_TEMP/audit-lint.json" \
            --linters-report "$RUNNER_TEMP/audit-linters.json" \
            --runner "${{ matrix.runner }}"

      - name: Run vulnerability scan
        shell: bash
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < "$RUNNER_TEMP/tracked-go-packages.txt"
          govulncheck "${packages[@]}"

      # gosec runs TWICE here, and that is the point of the step. It has
      # produced a run over an unchanged tree that dropped a strict subset of
      # its findings with a clean exit, well-formed JSON and unchanged
      # Stats.files/Stats.lines -- which the comparator reads as an
      # improvement. The wrapper refuses to hand either report to the
      # comparator unless the two runs agree; both are uploaded below either
      # way, because a disagreement is only diagnosable with both halves.
      #
      # Agreement rules out gosec run-to-run nondeterminism and nothing else --
      # it is not confirmation that a reduction was earned. That boundary is
      # stated in the step's own output and in quality-ratchet.py's
      # gosec_command docstring; do not restate it as a guarantee here.
      #
      # The wrapper's header carries what the second run costs, with the
      # command to re-derive it. Deliberately not duplicated here: two copies
      # of one measurement go stale independently.
      - name: Run standalone gosec twice and apply known-noise policy
        shell: bash
        run: |
          scripts/gosec-repeat-run.sh \
            --package-list "$RUNNER_TEMP/tracked-go-packages.txt" \
            --output-dir "$RUNNER_TEMP" \
            --runner "${{ matrix.runner }}"

      - name: Verify modules
        shell: bash
        run: |
          go mod verify
          go mod tidy -diff

      - name: Report dead code
        shell: bash
        run: |
          set -o pipefail
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < "$RUNNER_TEMP/tracked-go-packages.txt"
          deadcode -test "${packages[@]}" | tee "$RUNNER_TEMP/deadcode.txt"

      - name: Run aggregate race suite
        shell: bash
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < "$RUNNER_TEMP/tracked-go-packages.txt"
          go test -race -count=1 "${packages[@]}"

      - name: Report bare goroutine usage (safego adoption sweep)
        shell: bash
        run: |
          set -o pipefail
          grep -rn --include='*.go' --exclude='*_test.go' -E '^\s+go [A-Za-z_][A-Za-z0-9_.]*\(' \
            internal/plugin internal/worker internal/mcp internal/service \
            internal/server internal/api internal/memory \
            internal/sandbox internal/permission internal/secrets \
            internal/pathsafe internal/fsutil \
            2>/dev/null | grep -v 'safego\.Go' | grep -v 'safego\.Call' \
            | tee "$RUNNER_TEMP/lint-goroutines.txt" || echo "(no bare goroutines in target packages)" | tee "$RUNNER_TEMP/lint-goroutines.txt"

      # WHAT THIS STEP IS FOR. A gate that examined nothing prints the same
      # bytes as a gate that found nothing. This one died in its first assertion
      # on eight consecutive scheduled runs, and every one of them looked like
      # an ordinary red X -- the only visible tell was the duration, under two
      # minutes against a healthy fifteen, which nobody reads.
      #
      # So this reports COVERAGE, not findings: for each scanner, whether it
      # produced evidence at all. `if: always()` is load-bearing -- the whole
      # value is in what it says when an earlier step failed, where every
      # scanner below that step reads DID NOT RUN. A summary that only appeared
      # on success would describe exactly the runs that need no explaining.
      - name: Report what this run actually examined
        if: always()
        shell: bash
        run: |
          package_file="$RUNNER_TEMP/tracked-go-packages.txt"
          if [ -s "$package_file" ]; then
            packages=$(grep -c . "$package_file")
          else
            packages=0
          fi

          {
            echo "## Coverage"
            echo
            echo "Whether each scanner produced evidence — not what it found."
            echo
            echo "| Stage | Examined |"
            echo "|---|---|"
            echo "| tracked Go packages discovered | ${packages} |"
          } >> "$GITHUB_STEP_SUMMARY"

          report_row() {
            if [ -s "$2" ]; then
              echo "| $1 | ${packages} packages |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $1 | **DID NOT RUN** |" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          report_row "lint ratchet"  "$RUNNER_TEMP/audit-lint.json"
          report_row "gosec"         "$RUNNER_TEMP/gosec.json"
          report_row "gosec repeat"  "$RUNNER_TEMP/gosec-repeat.json"
          report_row "dead code"     "$RUNNER_TEMP/deadcode.txt"
          report_row "safego sweep"  "$RUNNER_TEMP/lint-goroutines.txt"

          if [ "$packages" -eq 0 ]; then
            {
              echo
              echo "**This run examined no packages at all.** Every result above"
              echo "is the absence of a scan, not the absence of findings."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-repo-quality-reports
          path: |
            ${{ runner.temp }}/audit-lint.json
            ${{ runner.temp }}/audit-lint.txt
            ${{ runner.temp }}/audit-linters.json
            ${{ runner.temp }}/gosec.json
            ${{ runner.temp }}/gosec-repeat.json
            ${{ runner.temp }}/gosec-stderr.txt
            ${{ runner.temp }}/gosec-repeat-stderr.txt
            ${{ runner.temp }}/deadcode.txt
            ${{ runner.temp }}/lint-goroutines.txt
          if-no-files-found: ignore
          retention-days: 14

      # The comparator applies the Stage 1 per-linter regression baseline and
      # Stage 2 zero-tolerance for errcheck, errorlint, and nilerr.
