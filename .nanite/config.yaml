# Project agentrc config — nanite
agentrc_version: 2.2.0

agents:
  nanite-backend:
    name: Nanite Backend Engineer
    description: Go service development for the Nanite chat harness
    roles: [backend, go]
    skills: [go-build, go-lint, go-test, sp-test-driven-development, sp-systematic-debugging, sp-verification-before-completion]
    context: agents/backend.md

  nanite-frontend:
    name: Nanite Frontend Developer
    description: React/TypeScript UI development for the Nanite chat interface
    roles: [frontend, react]
    skills: [frontend-design, shadcn-ui, sp-test-driven-development, sp-systematic-debugging, sp-verification-before-completion]
    plugins: [vercel]
    context: agents/frontend.md

  nanite-plugin-dev:
    name: Nanite Plugin Developer
    description: Develop, audit, and maintain Nanite plugins and the plugin scaffold
    roles: [backend, go]
    skills: [go-build, go-lint, go-test, doc-note, doc-search, shadcn-ui]
    plugins: [vercel]
    context: agents/plugin-dev.md

  nanite-planner:
    name: Nanite Planner
    description: Strategic planning, scoping, and architecture decisions for Nanite
    roles: [strategic-planner]
    skills: [adr, blg, doc-note, doc-search, sp-using-superpowers, sp-brainstorming, sp-writing-plans, sp-executing-plans, superpowers:dispatching-parallel-agents]
    context: agents/planner.md

  nanite-reviewer:
    name: Nanite Code Reviewer (light)
    description: Lightweight PR review for Nanite. Uses the base code-review role (BLOCK/WARN/NOTE). For a release-grade deep audit, use nanite-reviewer-backend or nanite-reviewer-frontend instead.
    roles: [code-review, go]
    skills: [go-lint, go-test]

  nanite-reviewer-backend:
    name: Nanite Deep Reviewer (Backend)
    description: Release-grade deep code review for Nanite Go backend. Produces a structured audit folder under docs/audits/ using the deep-review skill's 5-level severity rubric. Use for subsystem, end-to-end, and whole-backend audits.
    roles: [code-review, go]
    skills: [deep-review, plan-review, go-build, go-lint, go-test, doc-note, doc-search]
    context: agents/reviewer-backend.md

  nanite-reviewer-frontend:
    name: Nanite Deep Reviewer (Frontend)
    description: Release-grade deep code review for the Nanite React/TS SPA. Produces a structured audit folder under docs/audits/ using the deep-review skill's 5-level severity rubric. Use for component, flow, and whole-frontend audits.
    roles: [code-review, react]
    skills: [deep-review, plan-review, doc-note, doc-search, shadcn-install]
    context: agents/reviewer-frontend.md
