version: 1
project:
  name: conduit
role: volon-managed
boot_profiles:
  - worker
write_paths:
  - .agentrc/tasks/
  - .agentrc/logs/
  - .agentrc/bootstrap.md
  - .agentrc/pcc/tasks/
  - outbox/
  - adr/
  - cmd/
  - internal/
  - ui/
  - docs/
protected_paths:
  - .agentrc/state/
  - .agentrc/pcc/global/

executor:
  mode: direct
  unsafe_mode: true
  timeout_seconds: 600
  max_agent_depth: 3
