# Nanite application configuration.
# Loaded at startup from config/nanite.yaml. Tunables that don't belong in
# user-facing settings or environment variables go here.
#
# NOT RELATED TO the nanite.yaml at the repo root, despite the identical
# basename. That one is project config for the person running Nanite
# (internal/config.Config, merging over ~/.config/nanite/config.yaml); this one
# is checked-in application tunables (internal/config.TunablesConfig, read by
# LoadAppConfig in internal/config/appconfig.go). Different type, different
# loader, different schema — neither overrides the other and they are never
# merged, so there is no precedence between them to work out.

http:
  # Host only: ASCII hostname, raw IPv4, or raw unbracketed IPv6; do not add a
  # port or brackets. Loopback-only by default. Set to 0.0.0.0 (or start
  # nanite with --bind-address 0.0.0.0) only when access from other hosts is
  # intentional.
  bind_address: 127.0.0.1

presence:
  # Minimum interval between cli_active presence events per session (seconds).
  # PTY adapters produce output rapidly; this throttles how often the UI is
  # notified that a CLI process is alive. Frontend should also debounce.
  cli_active_throttle_seconds: 5

artifacts:
  # Tool names whose invocations trigger automatic artifact creation.
  # Matched case-insensitively against tool_use events.
  auto_detect_tools:
    - Write
    - write
    - write_file
    - create_file
    - Edit
    - edit

  # Keys to look for in tool input to extract the file path.
  path_keys:
    - file_path
    - path
    - filename

  # Storage root for auto-detected and placed artifacts.
  storage_dir: data/artifacts

skills:
  # Filesystem root for the content-addressed vendored skill store —
  # installed SKILL.md packages (body + scripts/references/assets), keyed
  # by content address, immutable once written. See
  # docs/engineering/architecture/20-skills.md.
  vendor_storage_dir: data/skills/vendor
