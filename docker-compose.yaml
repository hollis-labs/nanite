services:
  conduit:
    build: .
    ports:
      - "8090:8090"
    volumes:
      - conduit-data:/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - CONDUIT_AUTH_USER=${CONDUIT_AUTH_USER:-}
      - CONDUIT_AUTH_PASSWORD=${CONDUIT_AUTH_PASSWORD:-}
    restart: unless-stopped

volumes:
  conduit-data:
