services:
  nanite:
    build: .
    ports:
      - "8090:8090"
    volumes:
      - nanite-data:/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NANITE_AUTH_USER=${NANITE_AUTH_USER:-}
      - NANITE_AUTH_PASSWORD=${NANITE_AUTH_PASSWORD:-}
    restart: unless-stopped

volumes:
  nanite-data:
