# AUDIT-ONLY golangci-lint config. Not used by CI/hooks/make lint.
# Base = project .golangci.yml, plus complexity/duplication reporting linters
# per docs guide section 15. Reporting only — not wired into any gate.

version: "2"

run:
  go: "1.25"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - revive
    - misspell
    - unconvert
    - unparam
    - exhaustive
    - errorlint
    - nilerr
    - forbidigo
    # --- audit-only additions (guide section 15) ---
    - cyclop
    - gocyclo
    - gocognit
    - maintidx
    - nestif
    - dupl
    - funlen

  settings:
    errcheck:
      exclude-functions:
        - fmt.Print
        - fmt.Println
        - fmt.Printf
        - fmt.Fprint
        - fmt.Fprintln
        - fmt.Fprintf

    exhaustive:
      default-signifies-exhaustive: true

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^os\.WriteFile$'
          msg: "use internal/fsutil.AtomicWriteFile for crash-safe writes (Phase 1 Wave 1)"
        - pattern: '^filepath\.Join$'
          msg: "use internal/pathsafe.ResolveUnder to prevent path traversal (Phase 1 Wave 1)"

    gosec:
      excludes:
        - G104

    govet:
      enable-all: true
      disable:
        - fieldalignment

    misspell:
      locale: US

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
          disabled: true
        - name: var-declaration
        - name: var-naming

    staticcheck:
      checks:
        - "all"
        - "-ST1000"

    unparam:
      check-exported: false

    # --- audit-only linter settings (guide section 15) ---
    cyclop:
      max-complexity: 15
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 5
    dupl:
      threshold: 100
    funlen:
      lines: 100
      statements: -1

  exclusions:
    generated: lax
    rules:
      - text: 'AtomicWriteFile'
        linters: [forbidigo]
        path-except: '(internal/agent/|internal/service/install/|internal/plugin/builtin/adapter-)'
      - text: 'ResolveUnder'
        linters: [forbidigo]
        path-except: '(internal/sandbox/|internal/mcp/|internal/service/install/)'
      - path: '^internal/(safego|pathsafe|lifecycle|fsutil)/'
        linters: [forbidigo]
      - path: _test\.go
        linters:
          - errcheck
          - unparam
          - dupl
          - funlen
      - path: _gen\.go
        linters:
          - all
      - path: \.pb\.go
        linters:
          - all
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
