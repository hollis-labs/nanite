id: codex-smoke
display_name: "Codex CLI (smoke)"
launch: codex-smoke

identity:
  lineage_alias: nanite-codex-smoke
  role: backend
  project: nanite
  work_root: /tmp/nanite-codex-smoke-workdir
  tracking_root: /tmp/nanite-codex-smoke-tracking
  vanta_primary: "true"

# Inline vars get merged into the substitution map (caller-supplied vars win
# on key collision). Mirrors claude-smoke.yaml.
vars:
  agent_label: "Smoke Codex Backend"

# Slots populated entirely from `text` and `static` sources — both resolve at
# compile time, so this profile boots without a deferred-resolver path.
# Both substituted variables are resolvable WITHOUT caller-supplied vars
# (identity-derived + profile inline vars), so the registry's initial Reload
# (which compiles with empty caller vars) succeeds and the dropdown surfaces it.
slots:
  agent:
    type: text
    content: |
      You are {{agent_label}} for the {{project}} project.
      work_root: {{work_root}}
      role: {{role}}

  rules:
    type: static
    # Path is resolved relative to the catalog root (the directory
    # `boot_profile_catalog_path` points at).
    path: rules.md
