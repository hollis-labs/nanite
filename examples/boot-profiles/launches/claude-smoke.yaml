id: claude-smoke
# `pty-claude` is the canonical CLI alias for the Claude code adapter.
# bootprofile.Compile normalizes this to the bare adapter "claude" on
# LaunchSpec.Provider while preserving "pty-claude" on ProviderAlias.
# The chat-resolve layer hands "pty-claude" back to the classifier so
# chat.IsCLIProvider matches and routing reaches the CLI bypass.
provider: pty-claude

workdir: /tmp/nanite-smoke-workdir

ui_label: "Claude CLI (smoke)"

# Env values overlay the host env at agent.Boot time (precedence is
# host < profile < Options.Env, so spec values beat host env).
env:
  NANITE_SMOKE: "1"

# Args are appended to opts.ExtraArgs and spliced after the adapter's
# default BuildArgs.
args:
  - --add-dir
  - /tmp/nanite-smoke-workdir

# boot_mode is optional; empty falls through to the adapter default.
# Set to "file" to force the layout's CLAUDE.md path, "stdin" / "inline"
# for the other two adapter modes.
boot_mode: ""
