# Room to debug: a long idle window so a run is not cut off while someone reads
# a trace, and a higher iteration ceiling. An ordinary profile, selected like
# any other; it is not tied to the devmode build tag.
name: dev
extends: default
description: Longer idle window, higher iteration ceiling and a warn-only write-claim guard for debugging.
limits:
  idle_timeout_ms: 3600000
harness:
  hard_ceiling: 400
hooks:
  # Warn instead of block: while debugging, a flagged reply is reported but not
  # sent back for correction.
  write_claim_guard: warn
