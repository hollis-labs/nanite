schema_version: 1
name: debug-widgets
id: debug-widgets
version: 1.0.0
description: Slot inspector and turn snapshot widgets (developer_mode only)
author: Nanite
license: Apache-2.0
protocol: 1
runtime: builtin
registers:
  components:
    - name: slot-inspector
      type: widget
