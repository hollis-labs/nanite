# lefthook.yml — Fragments Engine shared pre-commit/pre-push hooks
# Reference copy lives in mentat repo; copied to all FE projects.
#
# THIS FILE ENFORCES NOTHING UNTIL `lefthook install` HAS RUN IN THE CLONE.
# A tracked lefthook.yml installs no git hooks by itself. Fresh clones must run
# `lefthook install` once — see README.md "Quick Start" and AGENTS.md
# "Common operations". A worktree of an already-installed clone is covered:
# `core.hooksPath` is an absolute path into the parent clone's `.git/hooks`,
# which every worktree shares. Confirm with `git config --get core.hooksPath`.
#
# Scope. Commit time is formatting only, and every pre-commit command is
# staged-files-only:
#   go-format         staged files only
#   migration-purity  staged files only
#   frontend-lint     staged files only — `skip: true`, see its own note
#
# No pre-commit command can fail for a reason outside the diff being committed.
# That is deliberate and it is the whole design: `--no-verify` is all-or-
# nothing, so a single finding unrelated to the change in front of you must
# never be able to disable every check at once.
#
# Whole-repo analysis lives in `scripts/check.sh`, the landing check —
# `go vet ./...`, scoped `golangci-lint`, and `go test ./...` (Tier 1 of
# `docs/engineering/testing-workflow.md` §3). Run it when a feature lands,
# before pushing a branch you care about, and before dispatching the full-repo
# quality gate. Not on every commit.
#
# Cost, measured on nanite @ 9591c1a6 (2026-08-24) across three real
# `git commit` attempts with one staged .go file, reading lefthook's own
# summary each time:
#   pre-commit total   0.17s / 0.06s / 0.06s
#     go-format        0.16s / 0.04s / 0.03s
#     migration-purity  (skip) no files for inspection — no staged .sql
#     frontend-lint     (skip) by condition — `skip: true`
# The 0.17s run also re-synced the installed hooks. Re-derive rather than
# trusting this block: stage one .go file, commit, read lefthook's summary.
#
# `skip_empty: true` on the commands below is inert at the installed lefthook
# (2.1.4): `lefthook dump` omits the key and `lefthook validate` reports
# "No values are allowed because the schema is set to 'false'" for each of the
# four commands carrying it. The behavior it names is 2.1.4's default and was
# confirmed directly — a `git commit` with no staged .sql prints
# `migration-purity (skip) no files for inspection`, and a docs-only push on
# `main` prints `go-test (skip) no matching push files`. Dropping the key is a
# separate cleanup; check `lefthook validate` before assuming it is done.

pre-commit:
  parallel: true
  commands:

    # ── Go parallel group ─────────────────────────────────────────────
    # Runs on staged .go files only.

    go-format:
      # Fail if any staged Go file is not gofmt + goimports clean.
      glob: "*.go"
      skip_empty: true
      run: |
        unformatted=$(gofmt -l {staged_files} 2>/dev/null)
        if command -v goimports >/dev/null 2>&1; then
          # Newline separator matters: $(...) strips trailing newlines, so a
          # bare "$unformatted$(goimports -l ...)" glues gofmt's last filename
          # onto goimports' first and prints one unusable run-together path.
          unformatted=$(printf '%s\n%s' "$unformatted" "$(goimports -l {staged_files} 2>/dev/null)")
        fi
        unformatted=$(echo "$unformatted" | sed '/^$/d' | sort -u)
        if [ -n "$unformatted" ]; then
          echo "Unformatted files:"
          echo "$unformatted"
          exit 1
        fi

    migration-purity:
      # Migrations carry schema and data *shape* changes, not seed rows.
      #
      # Rejected: a literal `VALUES` clause — that is seed data, and it belongs
      # in seed.go.
      # Allowed: data migrations, which are legitimate and sometimes required —
      #   * `UPDATE ... SET ...` / `DELETE FROM ...` backfills and cleanups;
      #   * the `INSERT INTO t_new SELECT ... FROM t` copy that SQLite's
      #     table-rebuild idiom requires, because SQLite cannot ALTER a CHECK
      #     constraint. 20 of the 146 migrations in this repo already depend on
      #     that form.
      #
      # The check anchors on the VALUES keyword rather than on INSERT because
      # 60 of the 67 INSERT statements here start on a line that carries neither
      # keyword (`INSERT INTO t (\n  cols...\n)\nSELECT`), so an INSERT-anchored
      # line match cannot tell a seed from a rebuild. `--` comments are stripped
      # first so prose about "values" does not trip the gate.
      glob: "internal/store/migrations/*.sql"
      skip_empty: true
      run: |
        found=0
        for f in {staged_files}; do
          hits=$(sed 's/--.*//' "$f" | grep -niw VALUES) || continue
          if [ "$found" = 0 ]; then
            echo "ERROR: Migrations must not contain seed rows (a VALUES clause)."
            echo "Move literal row data to seed.go. UPDATE/DELETE backfills and"
            echo "INSERT ... SELECT table rebuilds are allowed."
            found=1
          fi
          echo "$hits" | sed "s|^|$f:|"
        done
        if [ "$found" = 1 ]; then
          exit 1
        fi

    # ── Frontend parallel group (optional) ────────────────────────────
    # Runs only when a ui/, web/, or frontend/ directory exists.
    # Safe to leave in Go-only repos — skip conditions prevent errors.

    frontend-lint:
      # DISABLED 2026-08-24 — this command does not work in this repo, and was
      # only ever inert because no hooks were installed. Now that they are, it
      # had to be either fixed or switched off honestly; fixing it is tracked
      # as CW-20260816-0087 and is not this task's scope.
      #
      # Measured from the repo root, which is where lefthook runs it:
      #   npx --no-install biome --version        -> 0.3.3   (an unrelated
      #                                              package; the project's is
      #                                              Biome 2.4.7, resolvable
      #                                              only from ui/)
      #   ui/node_modules/.bin/biome check <clean tracked file>   -> exit 1
      #   ...           same, plus --config-path ui               -> exit 1
      # So the original line silently runs the WRONG binary, and the obvious
      # repairs still fail on a known-clean file. biome's config lives at
      # ui/biome.json and it resolves paths against its own cwd, so a working
      # version has to run from ui/ with ui-relative paths — real work, not a
      # flag. A hook that greenlights a commit by invoking an unrelated program
      # is the exact "looks like a gate, is not" state this file was activated
      # to end, so it stays off until it genuinely works.
      #
      # ui/package.json's own scripts remain the real check in the meantime.
      skip: true
      glob: "*.{ts,tsx,js,jsx}"
      skip_empty: true
      run: npx biome check --no-errors-on-unmatched {staged_files}

pre-push:
  commands:

    go-test:
      # Full test suite gate before code reaches the remote, scoped to `main`.
      # Pushes to a WIP branch do not pay for it; a push to `main` does, and
      # that is where it matters, because this repo has no branch protection
      # and no merge gate — see TASKS/INDEX.md point 4.
      #
      # This is the **no-`-race`** suite. It is not Tier 3: Tier 3 is the same
      # packages under `-race`, ~9 min, and it belongs to the nightly full-repo
      # quality gate, not to a hook.
      #
      # `only: - ref: main` and `glob`/`skip_empty` print different skip
      # reasons, which is what makes the scoping testable:
      #   on a non-`main` branch  -> `go-test (skip) by condition`
      #   on `main`, no .go files -> `go-test (skip) no matching push files`
      #
      # Measured on nanite @ 9591c1a6 (2026-08-24),
      # `go clean -testcache && /usr/bin/time -p go test ./...`:
      #   real 41.34s with nothing cached (0 of 99 test packages cached)
      # then two back-to-back cached runs, `/usr/bin/time -p go test ./...`:
      #   real  5.06s / 4.59s with everything cached (99/99 cached)
      # `go test ./...` covers all 110 packages `go list ./...` reports, which
      # includes the stray vendored `ui/node_modules/.../flatted` package; 99
      # of them have test files. Re-derive before quoting.
      only:
        - ref: main
      glob: "*.go"
      skip_empty: true
      run: go test ./...
