# lefthook.yml — Fragments Engine shared pre-commit/pre-push hooks
# Reference copy lives in mentat repo; copied to all FE projects.
#
# THIS FILE ENFORCES NOTHING UNTIL `lefthook install` HAS RUN IN THE CLONE.
# A tracked lefthook.yml installs no git hooks by itself. Fresh clones must run
# `lefthook install` once — see README.md "Quick Start" and AGENTS.md
# "Common operations". A worktree of an already-installed clone is covered:
# `core.hooksPath` is an absolute path into the parent clone's `.git/hooks`,
# which every worktree shares. Confirm with `git config --get core.hooksPath`.
#
# Scope. Commit time is formatting only, and every pre-commit command is
# staged-files-only:
#   go-format         staged files only
#   migration-purity  staged files only
#   frontend-lint     staged files only — `skip: true`, see its own note
#
# No pre-commit command can fail for a reason outside the diff being committed.
# That is deliberate and it is the whole design: `--no-verify` is all-or-
# nothing, so a single finding unrelated to the change in front of you must
# never be able to disable every check at once.
#
# Whole-repo analysis lives in `scripts/check.sh`, the landing check —
# `go vet ./...`, scoped `golangci-lint`, and `go test ./...` (Tier 1 of
# `docs/engineering/testing-workflow.md` §3). Run it when a feature lands,
# before pushing a branch you care about, and before dispatching the full-repo
# quality gate. Not on every commit.
#
# Cost, measured on nanite @ 9591c1a6 (2026-08-24) across three real
# `git commit` attempts with one staged .go file, reading lefthook's own
# summary each time:
#   pre-commit total   0.17s / 0.06s / 0.06s
#     go-format        0.16s / 0.04s / 0.03s
#     migration-purity  (skip) no files for inspection — no staged .sql
#     frontend-lint     (skip) by condition — `skip: true`
# The 0.17s run also re-synced the installed hooks. Re-derive rather than
# trusting this block: stage one .go file, commit, read lefthook's summary.
#
# Push time is branch-scoped, not file-scoped. All three `pre-push` commands
# are gated on `only: - ref: main` and nothing else decides: `migration-number`
# rejects a colliding or back-filling migration number, then
# `quality-ratchet-test` runs the 69-test comparator suite, then `go-test` runs
# `go test ./...`. None carries a `glob` — see their own notes for why a file
# filter here is a silent fail-open rather than a saving.
#
# Reading that order back: use the streamed `|  <name> >` banner lines. The
# summary block sorts failed commands to the end, so it shows execution order
# only on an all-green run; `lefthook dump` always renders name order.
#
# `skip_empty: true` on the three pre-commit commands is inert at the installed
# lefthook (2.1.4): `lefthook dump` omits the key and `lefthook validate`
# reports "No values are allowed because the schema is set to 'false'" for each
# command carrying it. The behavior it names is 2.1.4's default and was
# confirmed directly — a `git commit` with no staged .sql prints
# `migration-purity (skip) no files for inspection`. Dropping the key from the
# remaining three is a separate cleanup; check `lefthook validate` before
# assuming it is done.

pre-commit:
  parallel: true
  commands:

    # ── Go parallel group ─────────────────────────────────────────────
    # Runs on staged .go files only.

    go-format:
      # Fail if any staged Go file is not gofmt + goimports clean.
      #
      # A tool failure fails this hook loudly. `gofmt -l` prints NOTHING on
      # stdout when it cannot do its job — binary not on PATH, a file it cannot
      # parse, a path it cannot read — and an empty stdout is indistinguishable
      # from "everything is clean" unless the exit status is inspected. That
      # matters more here than anywhere: commit time is formatting only, so
      # this is the whole commit-time gate. A hook that can pass vacuously
      # means commit time gates nothing at all.
      #
      # stderr is folded into the captured output so the reason is printable;
      # the status check is what keeps a tool's error text from being mistaken
      # for a filename. `scripts/check.sh`'s format stage carries the same
      # guard over the whole repo.
      glob: "*.go"
      skip_empty: true
      run: |
        unformatted=$(gofmt -l {staged_files} 2>&1)
        status=$?
        if [ "$status" -ne 0 ]; then
          echo "ERROR: gofmt did not run cleanly (exit $status). This hook"
          echo "       cannot pass files it never examined:"
          printf '%s\n' "$unformatted" | sed 's/^/       /'
          exit 1
        fi
        if command -v goimports >/dev/null 2>&1; then
          imports=$(goimports -l {staged_files} 2>&1)
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "ERROR: goimports did not run cleanly (exit $status). This hook"
            echo "       cannot pass files it never examined:"
            printf '%s\n' "$imports" | sed 's/^/       /'
            exit 1
          fi
          # Newline separator matters: $(...) strips trailing newlines, so a
          # bare "$unformatted$imports" glues gofmt's last filename onto
          # goimports' first and prints one unusable run-together path.
          unformatted=$(printf '%s\n%s' "$unformatted" "$imports")
        fi
        unformatted=$(echo "$unformatted" | sed '/^$/d' | sort -u)
        if [ -n "$unformatted" ]; then
          echo "Unformatted files:"
          echo "$unformatted"
          exit 1
        fi

    migration-purity:
      # Migrations carry schema and data *shape* changes, not seed rows.
      #
      # Rejected: a literal `VALUES` clause — that is seed data, and it belongs
      # in seed.go.
      # Allowed: data migrations, which are legitimate and sometimes required —
      #   * `UPDATE ... SET ...` / `DELETE FROM ...` backfills and cleanups;
      #   * the `INSERT INTO t_new SELECT ... FROM t` copy that SQLite's
      #     table-rebuild idiom requires, because SQLite cannot ALTER a CHECK
      #     constraint. 20 of the 146 migrations in this repo already depend on
      #     that form.
      #
      # The check anchors on the VALUES keyword rather than on INSERT because
      # 60 of the 67 INSERT statements here start on a line that carries neither
      # keyword (`INSERT INTO t (\n  cols...\n)\nSELECT`), so an INSERT-anchored
      # line match cannot tell a seed from a rebuild. `--` comments are stripped
      # first so prose about "values" does not trip the gate.
      glob: "internal/store/migrations/*.sql"
      skip_empty: true
      run: |
        found=0
        for f in {staged_files}; do
          hits=$(sed 's/--.*//' "$f" | grep -niw VALUES) || continue
          if [ "$found" = 0 ]; then
            echo "ERROR: Migrations must not contain seed rows (a VALUES clause)."
            echo "Move literal row data to seed.go. UPDATE/DELETE backfills and"
            echo "INSERT ... SELECT table rebuilds are allowed."
            found=1
          fi
          echo "$hits" | sed "s|^|$f:|"
        done
        if [ "$found" = 1 ]; then
          exit 1
        fi

    # ── Frontend parallel group (optional) ────────────────────────────
    # Runs only when a ui/, web/, or frontend/ directory exists.
    # Safe to leave in Go-only repos — skip conditions prevent errors.

    frontend-lint:
      # DISABLED 2026-08-24 — this command does not work in this repo, and was
      # only ever inert because no hooks were installed. Now that they are, it
      # had to be either fixed or switched off honestly; fixing it is tracked
      # as CW-20260816-0087 and is not this task's scope.
      #
      # Measured from the repo root, which is where lefthook runs it:
      #   npx --no-install biome --version        -> 0.3.3   (an unrelated
      #                                              package; the project's is
      #                                              Biome 2.4.7, resolvable
      #                                              only from ui/)
      #   ui/node_modules/.bin/biome check <clean tracked file>   -> exit 1
      #   ...           same, plus --config-path ui               -> exit 1
      # So the original line silently runs the WRONG binary, and the obvious
      # repairs still fail on a known-clean file. biome's config lives at
      # ui/biome.json and it resolves paths against its own cwd, so a working
      # version has to run from ui/ with ui-relative paths — real work, not a
      # flag. A hook that greenlights a commit by invoking an unrelated program
      # is the exact "looks like a gate, is not" state this file was activated
      # to end, so it stays off until it genuinely works.
      #
      # ui/package.json's own scripts remain the real check in the meantime.
      skip: true
      glob: "*.{ts,tsx,js,jsx}"
      skip_empty: true
      run: npx biome check --no-errors-on-unmatched {staged_files}

pre-push:
  commands:

    migration-number:
      # The mechanical form of `docs/engineering/tracking-integrity.md`
      # **check 9**. Rejects a migration whose number collides with one already
      # on the remote's `main`, or which sits at or below the remote's highest
      # — a back-fill into a burned hole. Logic and its full rationale live in
      # `scripts/check-migration-number.sh`; only the placement is decided here.
      #
      # WHY PRE-PUSH AND NOT PRE-COMMIT. Not a style preference — pre-commit
      # structurally cannot catch this. A staged-file hook sees only the files
      # in its own worktree, so two agents each creating `149_*.sql` in separate
      # worktrees both pass and the collision only exists once both reach the
      # remote. That is exactly why `migration-purity` could not simply be
      # extended: it greps staged migration *contents* for a seed-row `VALUES`
      # clause and never reads a filename, and bolting a prefix check onto it
      # would still be comparing against the staged set. The check needs the
      # remote's state, and it needs it at the moment work leaves this machine.
      # Push is that moment. Commit is not: a commit can legitimately be made
      # offline, and this check requires the network.
      #
      # It also has to stay off pre-commit for the reason stated at the top of
      # this file — commit time is formatting only, every pre-commit command
      # fails only for reasons inside the diff in front of you, and `--no-verify`
      # is all-or-nothing. A network-dependent check there could disable
      # `go-format` for everyone on a bad connection.
      #
      # `priority: 1` puts this ahead of `go-test`: it costs well under a second
      # and the failure it catches is unrecoverable, so it should not sit behind
      # the suite. The key is load-bearing, not decorative — YAML order does not
      # decide this. At lefthook 2.1.4 the commands otherwise run in name order,
      # so without `priority` `go-test` goes first. Verified in both directions
      # against a real push to a scratch remote: no `priority` ->
      # `go-test (0.05s)` then `migration-number (0.24s)`; `priority: 1` ->
      # `migration-number (0.17s)` then `go-test`. Re-derive by reading
      # lefthook's own pre-push summary, not by reading `lefthook dump`, which
      # renders the commands in name order regardless.
      #
      # NO `glob` HERE, DELIBERATELY — same reasoning as `go-test` below, and it
      # bites harder here. `glob: "internal/store/migrations/*.sql"` looks like
      # the exactly-right filter and is the worst possible one: lefthook would
      # print `migration-number (skip) no matching push files` for any push that
      # did not itself touch a migration, which reads as benign and correct.
      # The branch condition carries all the scoping. The script derives its own
      # file set by diffing HEAD against the remote's `main`, which is the only
      # place the answer actually lives.
      #
      # The script fails closed — unreachable remote, missing branch, stale
      # `origin/main`, or an empty migration set on the remote all abort loudly
      # with a `git fetch` or equivalent instruction. It never no-ops.
      priority: 1
      only:
        - ref: main
      run: ./scripts/check-migration-number.sh

    go-test:
      # Full test suite gate before code reaches the remote, scoped to `main`.
      # Pushes to a WIP branch do not pay for it; every push to `main` does,
      # and that is where it matters, because this repo has no branch
      # protection and no merge gate — see TASKS/INDEX.md point 4.
      #
      # This is the **no-`-race`** suite. It is not Tier 3: Tier 3 is the same
      # packages under `-race`, ~9 min, and it belongs to the nightly full-repo
      # quality gate, not to a hook.
      #
      # The branch is the only trigger. `only: - ref: main` carries the whole
      # scoping, so there is exactly one skip reason and it is testable:
      #   on a non-`main` branch -> `go-test (skip) by condition`
      #   on `main`              -> the suite runs, whatever is in the push
      #
      # NO `glob` HERE, DELIBERATELY. A file filter on this command is a
      # silent fail-open. `glob: "*.go"` matches neither `go.mod` nor `go.sum`
      # nor any of the non-Go inputs compiled into the binary: 22 `//go:embed`
      # directives pull in the 147 `internal/store/migrations/*.sql` files,
      # `all:framework`, `all:templates`, `all:ui_dist`, `examples/*.json`, the
      # plugin JSON schema, 11 `plugin.yaml` files, scaffold templates, agent
      # profiles and the Python workflow-runner scripts. Derive rather than
      # trust these two counts:
      #   grep -rn '^//go:embed' --include='*.go' . | grep -v node_modules | wc -l
      #   ls internal/store/migrations/*.sql | wc -l
      # So a filtered push hook drops a migration-only push entirely while
      # printing `go-test (skip) no matching push files`, which reads as a
      # benign, correct skip. Migration number collisions are this repo's one
      # unrecoverable failure class, so that is the worst thing to skip
      # quietly. Enumerating the extra paths instead was considered and
      # rejected: it covers only the cases someone thought of and goes stale
      # against the next `go:embed` addition. The accepted cost is that a
      # docs-only push to `main` also runs the suite — seconds, cached.
      #
      # No `skip_empty` here either. With no `glob` there is no file list for
      # it to act on, and at 2.1.4 the key is not in the schema at all —
      # `lefthook validate` rejects every command that carries one, and
      # `lefthook dump` renders `glob` but omits `skip_empty`.
      #
      # Measured on nanite @ 9591c1a6 (2026-08-24),
      # `go clean -testcache && /usr/bin/time -p go test ./...`:
      #   real 41.34s with nothing cached (0 of 99 test packages cached)
      # then two back-to-back cached runs, `/usr/bin/time -p go test ./...`:
      #   real  5.06s / 4.59s with everything cached (99/99 cached)
      # `go test ./...` covers all 110 packages `go list ./...` reports, which
      # includes the stray vendored `ui/node_modules/.../flatted` package; 99
      # of them have test files. Re-derive before quoting.
      only:
        - ref: main
      run: go test ./...

    quality-ratchet-test:
      # The 69-test suite for the full-repo quality comparator. Until this
      # command existed the suite was committed and run by nothing:
      #   /usr/bin/grep -rn 'quality-ratchet_test' . | /usr/bin/grep -v node_modules
      # matched only `TASKS/` and one prose line in
      # `docs/engineering/failure-modes.md` -- not `.github/`, not
      # `scripts/check.sh`, not this file. Five of those tests are the only
      # committed proof that the gosec stderr assertion works at all.
      #
      # WHY PRE-PUSH AND NOT `scripts/check.sh`. check.sh was the obvious home
      # and it is the wrong one for this specific defect. The defect is *a check
      # exists and nothing is required to run it*; check.sh is opt-in by its own
      # header ("run it when a feature lands", not always). Moving 69 unrun
      # tests into a script nobody is obliged to invoke reproduces the original
      # failure one level up -- it would read as fixed and would not be. This
      # hook is the only path that is both mandatory and prior to the damage.
      #
      # WHY NOT THE NIGHTLY GATE. `scripts/quality-ratchet.py` has exactly one
      # consumer, `.github/workflows/full-repo-quality.yml`, so "test the tool
      # immediately before using it" is a real argument. It loses on timing: a
      # broken comparator would reach `main` and sit until the 07:17 UTC cron,
      # surfacing inside the one job whose signal is already mixed with a known
      # intermittent. Late, and noisy when it arrives.
      #
      # NO `glob` HERE, DELIBERATELY -- and the argument is stronger than it is
      # for `go-test`. `glob: "scripts/quality-ratchet*.py"` looks exactly right
      # and is the trap: the suite also drives `scripts/gosec-repeat-run.sh`
      # (`WRAPPER` at quality-ratchet_test.py:15, invoked at :1228), so that
      # filter would drop every change to the shell script these tests exercise
      # while printing `(skip) no matching push files`. That reads benign. The
      # branch condition carries all the scoping, as it does for the two
      # commands above.
      #
      # The suite is safe to run from a hook and fails closed:
      #   * cwd-independent -- SCRIPT/WRAPPER resolve via
      #     `Path(__file__).with_name(...)`, so no `cd` is needed.
      #   * no toolchain of its own -- it writes its own `gosec` stub onto PATH
      #     rather than needing the real binary, and it passes under both
      #     /usr/bin/python3 (3.9.6, Xcode CLT) and a brew python3 (3.14.0).
      #   * `go` IS required: setUp runs `go env GOOS GOARCH` with check=True.
      #     With `PATH=/usr/bin:/bin:/usr/sbin:/sbin` the suite reports
      #     `FAILED (errors=69)`, not 69 skips. A runner that degraded to green
      #     on a missing toolchain would be this command's own defect wearing
      #     the fix, so that direction is the correct one.
      #   * a suite that ran NOTHING is caught by the run block below, not by
      #     the interpreter. `unittest.main()`'s zero-test exit code is
      #     version-dependent -- 3.13/3.14 exit 5 ("NO TESTS RAN"), but 3.9.6
      #     (macOS's /usr/bin/python3) prints "OK" and exits 0. So on a stock
      #     Xcode-CLT box a file that lost its `test_`-prefixed methods, say to
      #     a refactor into bare pytest-style functions, would pass this gate
      #     green having asserted nothing -- this command's own reason for
      #     existing, one level in. Hence the parsed-count floor.
      #
      # WHAT THIS DOES NOT COVER. Stated because a gate whose boundary is
      # unwritten gets read as covering everything:
      #   * any clone where `lefthook install` was never run -- `find .git/hooks
      #     -type f ! -name '*.sample'` returns nothing there and this enforces
      #     nothing. Pre-existing, shared with both commands above.
      #   * `--no-verify`, which is all-or-nothing and takes this with it.
      #   * pushes to any branch other than `main`, by design -- and note the
      #     sharper case `migration-number` already spells out: `git push
      #     <remote> feature:main` is gated on the LOCAL ref, so it prints
      #     `(skip) by condition` while the commit lands on the remote's
      #     `main`. Same "reads as a benign, correct skip" shape the no-`glob`
      #     ruling exists to prevent, and this command inherits it.
      #   * anything merged on github.com without a local push -- no branch
      #     protection, no merge gate.
      #   * correctness of the comparator. A green run proves those 69
      #     assertions hold; it is evidence about the failures they were written
      #     against and nothing else. A comparator wrong in a way no test
      #     encodes still passes here.
      #
      # `priority: 2` puts this between `migration-number` and `go-test`,
      # because its failures are cheap to diagnose and fix -- NOT because it is
      # cheap to run. Measured at acc46a00, alternating back-to-back:
      #   python3 scripts/quality-ratchet_test.py   real 5.56 / 5.43
      #   go test ./...            (warm cache)     real 4.28 / 4.30
      #   go test ./...            (cold cache)     real 44.66
      # So on a warm cache this is the SLOWEST of the three, not a fraction of
      # anything; it is only small against a cold `go test`. Re-derive with
      # `/usr/bin/time -p` on both rather than trusting these.
      #
      # Verify that ordering from the streamed `|  <name> >` banner lines, NOT
      # from the summary and not from `lefthook dump`. All three disagree. On a
      # run where this command failed, the banners appeared in execution order
      # (`migration-number`, `quality-ratchet-test`, `go-test`) while the
      # summary below them listed `go-test` second and the failed
      # `quality-ratchet-test` last -- the summary sorts failures to the end,
      # so it reports execution order correctly only while everything passes.
      # `lefthook dump` renders commands in name order regardless.
      #
      # What a pusher who fails this actually sees: the useful lines -- the
      # AssertionError, the `FAILED (failures=N)` tail, and any message the
      # wrapper printed -- reach the STREAM, under this command's own banner.
      # The summary block carries only `quality-ratchet-test (Ns)` with no
      # reason attached. Scroll up to the banner, not down to the summary.
      priority: 2
      only:
        - ref: main
      run: |
        output=$(python3 scripts/quality-ratchet_test.py 2>&1)
        status=$?
        printf '%s\n' "$output"
        if [ "$status" -ne 0 ]; then
          exit "$status"
        fi
        # A zero exit is not on its own a pass -- see the fail-closed note
        # above. unittest writes its tally to stderr, folded in by the 2>&1.
        ran=$(printf '%s\n' "$output" | sed -n 's/^Ran \([0-9][0-9]*\) test.*/\1/p' | tail -1)
        if [ -z "$ran" ] || [ "$ran" -eq 0 ]; then
          echo "ERROR: quality-ratchet_test.py exited 0 but no test count could be" >&2
          echo "       confirmed (parsed: '${ran:-none}'). A suite that ran nothing" >&2
          echo "       is not a pass. Check the file still defines test_ methods." >&2
          exit 1
        fi
