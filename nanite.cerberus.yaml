      - api
      - go
      - launchd
      - v2
  - id: nanite-frontend
    name: Nanite Frontend
    type: process
    project: nanite
    connector: local
    config:
      command:
        - npm
        - run
        - dev
      dir: /Users/chrispian/dev/hollis-labs/apps/nanite/ui
      mode: dev_session
      port: 5176
      run_from: workspace
      url: http://localhost:5176
    tags:
      - gui
      - frontend
      - vite
      - v2
