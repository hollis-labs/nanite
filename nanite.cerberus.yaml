kind: cerberus-project/v1
owner: nanite
namespace: local
project:
  id: nanite
  name: Nanite
resources:
  - id: nanite-api-service
    name: Nanite (Mac, secondary instance)
    type: process
    project: nanite
    connector: local
    env: dev
    owner: self
    admin: self
    config:
      # The main chat instance runs on agent-os (hub-nanite). This is the Mac's own
      # instance (workspace mesh-chat) for local agents and experiments. Nothing is built
      # on this machine: the binary comes from CI and is installed by fleet-install, which
      # flips the stable symlink below and reloads this resource (CW-20261024-0120):
      #   fleet-install deploy nanite --target mac-nanite --repo hollis-labs/nanite --latest-green
      command:
        - ~/.local/share/nanite/current/nanite
        - serve
        - --port
        - "8090"
        - --bind-address
        - 127.0.0.1
      dir: ~/dev/hollis-labs/apps/nanite
      # Absolute paths in PATH: Cerberus expands ~ only at the start of a value.
      # Explicit env only: no env_file (the old .env pinned NANITE_DB_PATH to the default
      # workspace) and nothing inherited from a shell.
      env:
        NANITE_WORKSPACE: mesh-chat
        PATH: /Users/chrispian/.local/share/mise/installs/go/1.25.3/bin:/Users/chrispian/.local/share/mise/installs/node/22.12.0/bin:/Users/chrispian/.local/bin:/Users/chrispian/.bun/bin:/Users/chrispian/go/bin:/Users/chrispian/.opencode/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      mode: os_service
      port: 8090
      run_from: workspace
      supervisor: launchd
      url: http://127.0.0.1:8090
      auto_start: true
      auto_restart: true
      restart_delay: 10s
      max_restart_attempts: 5
    tags:
      - api
      - go
      - launchd
      - v2
      - mac
  - id: nanite-frontend
    name: Nanite Frontend
    type: process
    project: nanite
    connector: local
    env: dev
    owner: self
    admin: self
    config:
      command:
        - npm
        - run
        - dev
      dir: ~/dev/hollis-labs/apps/nanite/ui
      mode: dev_session
      port: 5176
      run_from: workspace
      url: http://localhost:5176
    tags:
      - gui
      - frontend
      - vite
      - v2
  - id: nanite-db-backup
    name: Nanite DB Backup
    type: process
    project: nanite
    connector: local
    env: dev
    owner: self
    admin: self
    config:
      command:
        - sqlite-backup
        - --db=./main.db
        - --dest=~/dev/backups/nanite
        - --interval=1h
        - --keep-hourly=48
        - --keep-daily=14
      dir: .
registry_urn: msg://agent/agent-mux/prj_w723b9pvp3
