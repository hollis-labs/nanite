kind: cerberus-project/v1
owner: nanite
namespace: local
project:
  id: nanite
  name: Nanite
resources:
  - id: nanite-api-service
    name: Nanite API Service
    type: process
    project: nanite
    connector: local
    config:
      build_strategy:
        kind: make_standard
        rules:
          output: nanite
      command:
        - ./nanite
        - serve
      dir: /Users/chrispian/dev/hollis-labs/apps/nanite
      env_file: .env
      mode: os_service
      port: 8090
      run_from: artifact
      supervisor: launchd
      url: http://127.0.0.1:8090
