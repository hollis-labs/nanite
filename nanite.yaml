# Project-level nanite configuration (internal/config.RuntimeConfig). Merges over the
# user-level ~/.config/nanite/config.yaml — see internal/config/config.go for
# the full schema and merge semantics. Every key is optional; an empty file and
# a missing file mean the same thing.
#
# NOT RELATED TO config/nanite.yaml, despite the identical basename. That file
# is checked-in application tunables (internal/config.TunablesConfig, read by
# LoadAppConfig in internal/config/appconfig.go); this one is project config
# for the person running Nanite. Different type, different loader, different
# schema — neither overrides the other and they are never merged, so there is
# no precedence between them to work out.

# Uncomment to point the server at the shipped Worker -> Reviewer -> Gate
# example so agentworkflow.Registry loads it at startup. Left off by default:
# a workflow catalog is opt-in, and the convention is "no catalog -> no
# behavior change".
# workflow_definitions_path: examples/workflow-definitions
