plugins:
  # ── Core ────────────────────────────────────────────────────
  - name: agentrc
    repo: hollis-labs/nanite-plugin-agentrc
    description: "Syncs .agentrc agent definitions into database"
    type: core

  - name: agent-widgets
    repo: hollis-labs/nanite-plugin-agent-widgets
    description: "Agent status and MCP tools discovery widgets"
    type: core

  - name: context-widgets
    repo: hollis-labs/nanite-plugin-context-widgets
    description: "Session context and token usage widgets"
    type: core

  - name: debug-widgets
    repo: hollis-labs/nanite-plugin-debug-widgets
    description: "Developer-mode debug widgets (broker, slots, turns)"
    type: core

  - name: observability-widgets
    repo: hollis-labs/nanite-plugin-observability-widgets
    description: "LLM execution metrics and telemetry widget"
    type: core

  - name: bookmarks
    repo: hollis-labs/nanite-plugin-bookmarks
    description: "Bookmarked messages quick-access widget"
    type: core

  # ── Default ─────────────────────────────────────────────────
  - name: session-stats
    repo: hollis-labs/nanite-plugin-session-stats
    description: "Session statistics tracking and display"
    type: default
