name: session-stats
version: 1.0.0
description: Session statistics tracking and display
author: Hollis Labs
url: https://github.com/hollis-labs/session-stats
short_desc: "Session statistics tracking and display"

requires:
  # No MCP servers required for this basic plugin
  mcp_servers: []

registers:
  envelopes:
    - type: session-stats
      renderer: SessionStatsCard
    - type: session-summary
      renderer: SessionSummaryCard

  quick_actions:
    - id: show-session-stats
      label: "Session Stats"
      icon: chart-bar
      handler: showSessionStats
      context: [session]
    - id: export-session-stats
      label: "Export Stats"
      icon: download
      handler: exportSessionStats
      context: [session]

  widgets:
    - id: session-stats-widget
      component: SessionStatsWidget
      slot: right-rail

  hooks:
    - event: session.start
      handler: onSessionStart
    - event: session.end
      handler: onSessionEnd
    - event: message.received
      handler: onMessageReceived

api_endpoints:
  - path: /api/plugins/session-stats/stats/{session_id}
    method: GET
    handler: getSessionStats
  - path: /api/plugins/session-stats/stats/{session_id}
    method: POST
    handler: updateSessionStats
  - path: /api/plugins/session-stats/export/{session_id}
    method: GET
    handler: exportSessionStats

database:
  tables:
    - name: session_stats
      schema: |
        CREATE TABLE IF NOT EXISTS session_stats (
          id TEXT PRIMARY KEY,
          session_id TEXT NOT NULL,
          message_count INTEGER DEFAULT 0,
          start_time TIMESTAMP,
          end_time TIMESTAMP,
          total_input_tokens INTEGER DEFAULT 0,
          total_output_tokens INTEGER DEFAULT 0,
          agent_switches INTEGER DEFAULT 0,
          tool_calls INTEGER DEFAULT 0,
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
        )