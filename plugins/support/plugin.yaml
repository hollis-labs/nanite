name: support
version: 0.1.0
description: IT employee self-service support — KB search + ticket creation

config:
  database_url:
    type: string
    required: true
    env_var: SUPPORT_DATABASE_URL
    default: "host=localhost port=5432 dbname=kb_demo sslmode=disable"
    description: "PostgreSQL connection string for KB database"

requires:
  mcp_servers: []

registers:
  envelopes:
    - type: kb-result
      component: components/chat/envelopes/KBResultCard
      export: KBResultCard
    - type: ticket-form
      component: components/chat/envelopes/TicketFormCard
      export: TicketFormCard
    - type: ticket-confirmation
      component: components/chat/envelopes/TicketConfirmationCard
      export: TicketConfirmationCard
    - type: resolution-capture
      component: components/chat/envelopes/ResolutionCaptureCard
      export: ResolutionCaptureCard

  quick_actions:
    - id: create-ticket
      label: "Create Ticket"
      icon: ticket
      handler: createTicket
      context: [session]

  hooks:
    - event: message.sent
      handler: onMessageSent

api_endpoints:
  - path: /api/plugins/tickets
    method: GET
    handler: listTickets
  - path: /api/plugins/tickets
    method: POST
    handler: createTicket
  - path: /api/plugins/tickets/{id}
    method: GET
    handler: getTicket
  - path: /api/plugins/ui/support-ticket-download
    method: GET
    handler: downloadTicket
