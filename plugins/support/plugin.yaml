name: support
version: 0.1.0
description: IT employee self-service support — KB search + ticket creation

requires:
  mcp_servers: []

registers:
  envelopes:
    - type: kb-result
      renderer: KBResultCard
    - type: ticket-form
      renderer: TicketFormCard
    - type: ticket-confirmation
      renderer: TicketConfirmationCard
    - type: resolution-capture
      renderer: ResolutionCaptureCard

  quick_actions:
    - id: create-ticket
      label: "Create Ticket"
      icon: ticket
      handler: createTicket
      context: [session]

  hooks:
    - event: message.sent
      handler: onMessageSent

api_endpoints:
  - path: /api/plugins/tickets
    method: GET
    handler: listTickets
  - path: /api/plugins/tickets
    method: POST
    handler: createTicket
  - path: /api/plugins/tickets/{id}
    method: GET
    handler: getTicket
  - path: /api/plugins/ui/support-ticket-download
    method: GET
    handler: downloadTicket
