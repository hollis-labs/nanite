name: teams
version: 0.1.0
description: Microsoft Teams integration — push messages and cards to Teams channels

config:
  teams_webhook_url:
    type: string
    required: true
    env_var: TEAMS_WEBHOOK_URL
    description: "Teams Incoming Webhook URL (from channel settings)"

agents:
  - agents/teams-connector.yaml

registers:
  envelopes:
    - type: teams-message
      component: ui/TeamsMessageCard
      export: TeamsMessageCard
